<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monorepo &amp; Design System — Technical Workshop</title>
    <meta
      name="description"
      content="A complete technical workshop: pnpm, Turborepo, design tokens, Figma to code, Radix UI, Storybook, Chromatic, and AI-assisted development."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
          <span class="brand-name">Monorepo <span class="brand-amp">&amp;</span> Design System</span>
          <span class="brand-tag">Workshop</span>
        </div>

        <div class="controls">
          <button class="ui-btn" id="tocBtn" type="button" title="Table of contents (O)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.6" />
              <rect x="14" y="3" width="7" height="7" rx="1.6" />
              <rect x="3" y="14" width="7" height="7" rx="1.6" />
              <rect x="14" y="14" width="7" height="7" rx="1.6" />
            </svg>
            <span>Contents</span>
          </button>
          <button class="ui-btn" id="notesBtn" type="button" title="Speaker notes (N)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v14a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z" />
              <path d="M8 8h8M8 12h8M8 16h5" stroke-linecap="round" />
            </svg>
            <span>Notes</span>
          </button>
          <button class="icon-btn" id="fullscreenBtn" type="button" title="Fullscreen (F)" aria-label="Toggle fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </header>

      <main class="viewport" id="viewport">
        <div class="stage" id="stage"></div>
      </main>

      <footer class="bottombar">
        <div class="chapter-indicator" id="chapterIndicator">01 · Introduction</div>
        <div class="bottom-shortcuts">
          <span><kbd>←</kbd><kbd>→</kbd> navigate</span>
          <span><kbd>O</kbd> contents</span>
          <span><kbd>N</kbd> notes</span>
        </div>
        <div class="pager">
          <button class="pager-btn" id="prevBtn" type="button" aria-label="Previous slide">←</button>
          <span id="counter">01 / 68</span>
          <button class="pager-btn" id="nextBtn" type="button" aria-label="Next slide">→</button>
        </div>
      </footer>
    </div>

    <div class="toc-overlay" id="tocOverlay" aria-hidden="true">
      <div class="toc-panel" role="dialog" aria-modal="true" aria-labelledby="tocTitle">
        <div class="toc-head">
          <div>
            <div class="eyebrow">Contents</div>
            <h2 id="tocTitle">68 slides · 9 chapters</h2>
          </div>
          <button class="icon-btn" id="tocClose" type="button" aria-label="Close contents">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="toc-list" id="tocList"></div>
        <div class="toc-foot">
          <span><kbd>←</kbd><kbd>→</kbd> move</span>
          <span><kbd>Esc</kbd> close</span>
          <span><kbd>N</kbd> notes</span>
          <span><kbd>F</kbd> fullscreen</span>
          <span class="toc-foot-note">Click any chapter or slide to jump.</span>
        </div>
      </div>
    </div>

    <div class="notes-panel" id="notesPanel" aria-hidden="true">
      <div class="notes-head">
        <div>
          <span class="notes-kicker">Speaker notes</span>
          <strong id="notesTitle">Slide</strong>
        </div>
        <button class="icon-btn" id="notesClose" type="button" aria-label="Close speaker notes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="notes-body" id="notesBody"></div>
    </div>

    <noscript>
      <div class="noscript">This presentation needs JavaScript enabled. Open index.html in a modern browser.</div>
    </noscript>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="helpers.js"></script>
    <script src="slides/ch1.js"></script>
    <script src="slides/ch2.js"></script>
    <script src="slides/ch3.js"></script>
    <script src="slides/ch4.js"></script>
    <script src="slides/ch5.js"></script>
    <script src="slides/ch6.js"></script>
    <script src="slides/ch7.js"></script>
    <script src="slides/ch8.js"></script>
    <script src="slides/ch9.js"></script>
    <script src="app.js"></script>
  </body>
</html>

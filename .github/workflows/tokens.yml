name: Tokens

on:
  push:
    paths:
      - "packages/tokens/tokens/**"
      - "packages/tokens/build.mjs"
      - "packages/tokens/scripts/**"
  workflow_dispatch:
  repository_dispatch:
    types: [tokens-updated]

concurrency:
  group: tokens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter @repo/tokens build

      - name: Verify generated outputs
        run: |
          test -f packages/tokens/dist/variables.css
          test -f packages/tokens/dist/tailwind.css
          test -f packages/tokens/dist/tokens.json

      - name: Upload tokens artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokens-dist
          path: packages/tokens/dist
          retention-days: 7
